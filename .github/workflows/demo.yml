# Build the verification page and publish it to Pages.
#
# _Authored by Claude Code_ - 2026-09-12.
#
# The three analyses run as independent jobs so a slow or broken tool cannot
# take the page down with it: each is continue-on-error, uploads whatever it
# produced, and merge.py turns anything missing into an `error` verdict.

name: verify and publish

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * *"     # nightly, so the page timestamp stays fresh
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  security-events: write

# No workflow-level concurrency. A single `pages` group here would serialize
# every run of this workflow, so a pull request's analysis would sit queued
# behind main's ~11-minute Mythril job and look like it never triggered. Only
# the deploy job actually cannot run twice at once, so the group lives there.

jobs:
  slither:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p out/raw out/normalized
      - run: python3 tools/run_slither.py
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: n-slither
          path: out/normalized/
          if-no-files-found: ignore

      # The PR annotation: Slither findings on the exact lines of the diff.
      # Both contracts are scanned, so a pull request that introduces
      # reentrancy is annotated whichever file it touches.
      - name: Slither SARIF
        continue-on-error: true
        run: |
          PYTHONPATH=tools python3 -c 'import solc_cache; solc_cache.ensure_solc()'
          mkdir -p sarif
          # The repo is mounted at /repo and used as the working directory so
          # Slither emits `contracts/X.sol` rather than a container-relative
          # `../../src/X.sol`. Code scanning cannot match the latter to a file
          # in the repo, and the inline PR annotation silently never appears.
          for f in VulnerableVault SafeVault; do
            docker run --rm \
              -v "$PWD":/repo:ro \
              -v "$PWD/.cache/solc/solc":/opt/solc:ro \
              -w /repo \
              --entrypoint slither trailofbits/eth-security-toolbox:nightly \
              "contracts/$f.sol" --solc /opt/solc --sarif - > "sarif/$f.sarif" || true
            # An empty file makes the upload fail; drop it instead.
            [ -s "sarif/$f.sarif" ] || rm -f "sarif/$f.sarif"
          done
          ls -la sarif
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: sarif

  smtchecker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p out/raw out/normalized
      # Builds vdemo/smtchecker (stock solc + Eldarica) on first use, because
      # no published solc binary contains a Horn solver.
      - run: python3 tools/run_smtchecker.py
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: n-smtchecker
          path: out/normalized/
          if-no-files-found: ignore

  mythril:
    runs-on: ubuntu-latest
    # Two analyses at a 300s execution timeout each, plus image pull.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p out/raw out/normalized
      - run: python3 tools/run_mythril.py
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: n-mythril
          path: out/normalized/
          if-no-files-found: ignore

  build:
    needs: [slither, smtchecker, mythril]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@v4
        with:
          path: dl
          pattern: n-*
          merge-multiple: true
      - run: |
          mkdir -p out/normalized
          cp -v dl/*.json out/normalized/ || true
      # Nonzero only if every tool failed; the page is still worth building.
      - run: python3 tools/merge.py || true
      - run: python3 tools/render.py
      - run: ls -la out
      - uses: actions/upload-artifact@v4
        with: { name: demo-page, path: out/ }
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with: { path: out }

  # The only job that is allowed to fail, and the reason a pull request that
  # reintroduces the bug goes red. Everything above is failure-tolerant on
  # purpose, so that one broken tool cannot take the published page down; that
  # tolerance is exactly what makes a separate gate necessary.
  gate:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: demo-page, path: out }
      - run: python3 tools/check.py

  deploy:
    # Deliberately not gated. The page is generated from whatever the tools
    # actually reported, so it stays honest even when the gate is red - and a
    # stale page would be worse than an accurate one showing a regression.
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Pages allows one deployment at a time; queue rather than cancel so a
    # nightly run cannot discard a push that is mid-publish.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
